[package]
name = "carosign-ui"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
rust-version = "1.96"

[dependencies]
carosign-adapters = { path = "../../runtime/carosign-adapters" }
carosign-core = { path = "../../core/carosign-core" }
carosign-linux-ipc = { path = "../../linux/carosign-linux-ipc" }
carosign-protocol = { path = "../../protocol/carosign-protocol" }
carosign-l10n = { path = "../carosign-l10n" }
dbus = "0.9.12"
libc = "0.2"
obscur-kit = { git = "https://github.com/AlexKletn/obscur.kit.git", rev = "20e58547187aee63377eb57dcd385949b0d01ccc", default-features = false, features = ["window-winit", "accesskit-window", "render-lyon", "text-harfrust", "text-unicode", "font-fontconfig", "resource-decode"] }

[build-dependencies]
grass = { version = "0.13.4", default-features = false }

[dev-dependencies]
pollster = "0.4"
tiny-skia = "0.11"
wgpu = "29"

[profile.dev]
debug = 0

[profile.release]
strip = true

<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Доступ к операциям проверяет адаптер по UID отправителя и политике. -->
  <policy user="root">
    <allow own="net.reactivated.Fprint"/>
    <allow send_destination="org.freedesktop.PolicyKit1"
           send_interface="org.freedesktop.PolicyKit1.Authority"
           send_member="CheckAuthorization"/>
  </policy>
  <policy context="default">
    <allow send_destination="net.reactivated.Fprint"/>
  </policy>
</busconfig>

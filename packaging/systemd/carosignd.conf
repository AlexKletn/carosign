# The socket path must be inside the service RuntimeDirectory.
socket=/run/carosignd/control.sock
store=/var/lib/carosign/metadata.redb
policy=/etc/carosign/policy.conf
# Set a provider profile only after installing a compatible provider.
# Without an explicit profile, the service uses /etc/carosign/providers.conf.
# provider_profile=/etc/carosign/provider.conf
ops_per_connection=4
observers_per_operation=8
queued_per_authenticator=16
hello_timeout_s=5
